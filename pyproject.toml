[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "agent-benchmark-lab"
version = "0.1.1"
description = "Run and gate auditable, reproducible agent benchmarks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Anh Dao" }]
dependencies = [
  "agenttrace-platform>=0.1,<0.2",
  "benchmark-audit-core>=0.1,<0.2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.28,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.uv.sources]
agenttrace-platform = { path = "../agent-trace-platform", editable = true }
benchmark-audit-core = { path = "../benchmark-audit-core", editable = true }

[project.scripts]
agent-benchmark = "agent_benchmark_lab.cli:main"

[tool.uv.build-backend]
module-name = "agent_benchmark_lab"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agent_benchmark_lab", "agenttrace", "benchmark_audit_core"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.coverage.run]
branch = true
source = ["agent_benchmark_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
