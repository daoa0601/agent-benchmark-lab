name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-benchmark-lab
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-benchmark-lab
          persist-credentials: false
      # uv.lock resolves these siblings as ../<name>; use their default branches.
      # agent-trace-platform is private: AGENT_TRACE_PLATFORM_TOKEN must be a read-only
      # (contents: read) fine-grained token or GitHub App token for that repository.
      - uses: actions/checkout@v4
        with:
          repository: daoa0601/agent-trace-platform
          path: agent-trace-platform
          token: ${{ secrets.AGENT_TRACE_PLATFORM_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: daoa0601/benchmark-audit-core
          path: benchmark-audit-core
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent-benchmark-lab/uv.lock
      - run: uv sync --extra dev --locked
      - run: make check
